<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7f9fa"/><text x="55" y="64" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0E3455">Как работает FBS с одного физического остатка</text><text x="55" y="100" font-family="Arial,sans-serif" font-size="18" fill="#68747b">Слабое место сценария — стык заказа, остатка и физической передачи маркетплейсу.</text><rect x="40" y="220" width="165" height="210" rx="18" fill="#fff" stroke="#cfdade"/><circle cx="122" cy="265" r="25" fill="#0E3455"/><text x="122" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">1</text><text x="122" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0E3455">Заказ</text><text x="122" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5b6870">WB / Ozon</text><path d="M 205 325 L 228 325" stroke="#198754" stroke-width="4"/><path d="M 221 317 L 229 325 L 221 333" fill="none" stroke="#198754" stroke-width="4"/><rect x="230" y="220" width="165" height="210" rx="18" fill="#fff" stroke="#cfdade"/><circle cx="312" cy="265" r="25" fill="#0E3455"/><text x="312" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">2</text><text x="312" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0E3455">API / WMS</text><text x="312" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5b6870">автоматически</text><path d="M 395 325 L 418 325" stroke="#198754" stroke-width="4"/><path d="M 411 317 L 419 325 L 411 333" fill="none" stroke="#198754" stroke-width="4"/><rect x="420" y="220" width="165" height="210" rx="18" fill="#fff" stroke="#cfdade"/><circle cx="502" cy="265" r="25" fill="#0E3455"/><text x="502" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">3</text><text x="502" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0E3455">Единый остаток</text><text x="502" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5b6870">1 физический сток</text><path d="M 585 325 L 608 325" stroke="#198754" stroke-width="4"/><path d="M 601 317 L 609 325 L 601 333" fill="none" stroke="#198754" stroke-width="4"/><rect x="610" y="220" width="165" height="210" rx="18" fill="#fff" stroke="#cfdade"/><circle cx="692" cy="265" r="25" fill="#0E3455"/><text x="692" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">4</text><text x="692" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0E3455">Сборка</text><text x="692" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5b6870">SKU + упаковка</text><path d="M 775 325 L 798 325" stroke="#198754" stroke-width="4"/><path d="M 791 317 L 799 325 L 791 333" fill="none" stroke="#198754" stroke-width="4"/><rect x="800" y="220" width="165" height="210" rx="18" fill="#fff" stroke="#cfdade"/><circle cx="882" cy="265" r="25" fill="#0E3455"/><text x="882" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">5</text><text x="882" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0E3455">Маркировка</text><text x="882" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5b6870">ШК / КИЗ</text><path d="M 965 325 L 988 325" stroke="#198754" stroke-width="4"/><path d="M 981 317 L 989 325 L 981 333" fill="none" stroke="#198754" stroke-width="4"/><rect x="990" y="220" width="165" height="210" rx="18" fill="#fff" stroke="#cfdade"/><circle cx="1072" cy="265" r="25" fill="#0E3455"/><text x="1072" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">6</text><text x="1072" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0E3455">Отгрузка</text><text x="1072" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#5b6870">рейсы WB / Ozon</text><text x="55" y="535" font-family="Arial,sans-serif" font-size="21" fill="#26343c">Чем реже рейсы и слабее синхронизация остатков, тем выше риск просрочки и двойной продажи.</text></svg>